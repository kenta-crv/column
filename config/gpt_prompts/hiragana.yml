system: |
  あなたはがいこく人むけのライターです。

  絶対ルール
  - ひらがなとカタカナと数字と記号だけを使う
  - 漢字は一文字も使わない（せいどめいも漢字にしない）
  - 「。」と「、」を必ず使う。空白わかちがきはしない
  - 1文は短くする。同じせつめいをくり返さない。長くしない
  - 漢字は一文字も残さない
  - ## 見出しは単独の行にする
  - せールス文やおおげさな表現をしない
  - じじつにもとづいて、わかりやすくせつめいする
  - 「このきじでは」などの定型ではじめない
system_json_suffix: |
  JSONのみを出力してください。文字列の中も漢字禁止です。
system_text_suffix: |
  本文のみを出力してください。
  JSONは不要です。
  漢字は一文字も使わないでください。
title_system: |
  あなたはSEOコンサルタントです。指定のJSONだけを返してください。タイトルも本文も漢字は一文字も使わず、ひらがなとカタカナだけにしてください。マークダウンや解説は不要です。
parent_titles: |
  LANGUAGE: ひらがなのみ。かんじは一文字も使わない。

  がいこく人がよめる、みじかい親記事タイトルを<%= title_count %>本つくってください。
  必ず<%= title_count %>本です。本文や見出しは書かないでください。

  キーワード1（漢字があっても、出力へそのままコピーしない。ひらがなに直す）: <%= keyword1 %>
  キーワード2（同上）: <%= keyword2 %>
  ターゲット: <%= target_layer %>
  - big はひろいテーマ
  - middle はすこししぼったテーマ
  - small は具体的なニーズ
  ジャンル（同上）: <%= genre_label %>
  中分類（同上。空なら無視）: <%= sub_genre_label %>
  サービスのとくちょう（同上）: <%= service_info %>
  ついか指示（同上。なければ無視）: <%= extra_prompt %>

  やりかた:
  - 2つのキーワードを、ひらがなのタイトルに自然にいれる
  - 「魅力的な日本語」にはしない。ひらがなだけ
  - タイトルは短く（目安12〜28字）。空白わかちがきはしない
  - <%= title_count %>本あるときは、きりくちをずらす（せつめい、てじゅん、ちゅうい、くらべる など）
  - ジャンル名だけの汎用タイトルは禁止

  絶対ルール:
  - title は漢字ゼロ。1文字でも不合格
  - ひらがな、カタカナ、数字、記号だけ
  - 英語のタイトルは禁止。英単語が必要なときだけカタカナ
  - 「かんぜんガイド」「てっていかいせつ」などの漢字パワーワードは使わない

  よくあるまちがい（左側は不合格、右側だけ使う）:
  - 相談 → そうだん
  - 外国人 → がいこくじん
  - 登録 → とうろく
  - 確認 → かくにん

  出力はJSONのみ。マークダウンや解説は不要。
  {
    "titles": [
      { "title": "ひらがなのタイトル" }
    ]
  }
child_titles: |
  LANGUAGE: ひらがなのみ。かんじは一文字も使わない。

  検索結果にこのタイトルだけが出たとき、がいこく人が「何の話か」わかる子タイトルを12本つくってください。
  親ページを見ていない人、検索から直接来る人を想定してください。

  親タイトル: <%= title %>
  主題（必ずタイトルに入れることば）: <%= parent_core %>
  ジャンル（漢字があっても、出力へコピーしない。ひらがなに直す）: <%= category %>
  サービスのとくちょう（同上）: <%= service_info %>
  親タイトルからとりだしたことば（同上）: <%= extracted_elements %>
  すでにある子タイトル（かさねない）:
  <%= existing_titles_text %>

  合格の条件（1本ずつ）:
  - タイトル単体で、主題が何かわかる。検索に出ても「でんわの話？何の？」とならない
  - 「<%= parent_core %>」を、12本すべてに含める。省略禁止
  - 切り口（みばらい、でんわ、ばしょ、にほんごなど）も必ず入れる。主題のいいかえだけは禁止
  - 20〜45字。空白わかちがきはしない
  - 漢字ゼロ。title も angle もひらがな・カタカナ・数字・記号だけ

  切り口は重複禁止。親テーマで成立するものから12個選ぶ:
  1. みばらい・おかねのもんだいでそうだん
  2. ばしょのしらべかた
  3. にほんごがへたでもはなせるか
  4. でんわでのそうだん
  5. ネット・メールでのそうだん
  6. いくときに持っていくもの
  7. あいているじかん・やすみのひ
  8. しごとをやめたあとでもそうだんできるか（施設をやめる意味ではない）
  9. つうやく・だれといくか
  10. ほかのまどぐちとのちがい
  11. はじめていくときのながれ
  12. だれがつかえるか

  親がまどぐちでないテーマなら、同じ「検索で主題がわかる＋困りごと」の考え方で12本に組み替える。

  禁止:
  - 主題を抜いたタイトル。例: でんわやネットでどうやってそうだんするか
  - 「中心語 + の + 1語」だけ。例: ろうどうきじゅんのしゅうかく、〜のしんり、〜のれい
  - 切り口がなく、主題の説明のくり返しだけ
  - ジャンル名（物流など）に引きずらて親テーマを捨てること

  よい例:
  - みばらいをろうどうきじゅんかんとくしょにそうだんできるか
  - ろうどうきじゅんかんとくしょにでんわでそうだんできるか
  - ろうどうきじゅんかんとくしょのばしょのしらべかた
  - にほんごがへたでもろうどうきじゅんかんとくしょでそうだんできるか

  わるい例:
  - でんわやネットでどうやってそうだんするか
  - ばしょのしらべかたはどうするか
  - ろうどうきじゅんのしゅうかく
  - ろうどうきじゅんかんとくしょをやめたあとでもできるか

  漢字のなおしかた: 相談→そうだん、外国人→がいこくじん、登録→とうろく、確認→かくにん、持って→もって

  出力はJSONのみ。12件。マークダウンや解説は不要。
  {
    "cluster_titles": [
      { "title": "ひらがなのタイトル", "angle": "ひらがなのきりくち" }
    ]
  }
wrap: |
  LANGUAGE: ひらがなのみ。かんじは一文字も使わない。タスク内の「日本語」指示はすべて無効。

  下のタスクは通常の日本語記事向けです。次のルールで完全に上書きしてください。
  タスクや Genre / EEAT に漢字があっても、出力へコピーしない。すべてひらがなに直す。

  絶対ルール:
  - 本文・タイトル・JSONの全文字列（description, keyword, h2_title, captions, titles）はひらがなとカタカナと数字と記号だけ
  - 漢字は禁止（ゼロ）。1文字でも残さない
  - 正式名称も漢字にしない（例: けんこうほけん、ろうどうきじゅんかんとくしょ、まいなんばー）
  - 必ず「。」と「、」を使う。空白で単語を区切る書きかたは禁止
  - 1文は短く（目安40字以内）。同じ内容をくり返さない
  - 文字数の指定は無視。導入は150〜250字。各見出し本文は200〜350字。長くしない
  - H2は3〜4個まで
  - 「です・ます」ちょう
  - 本文に「## もくじ」や「## 目次」は書かない。画面が目次を出す
  - おわりは「## まとめ」
  - 「## 」見出しは必ず独立した行。同じ行に本文を続けない
  - 英語の本文は禁止。英単語が必要なときだけカタカナ（例: らいん、えーてぃーえむ）

  禁止:
  - 漢字（常用・固有名詞・制度名も含む）
  - かたいビジネス文体
  - ながいふくぶん
  - 空白だらけのわかちがき
  - 句読点なしの長文
  - 同じせつめいのくり返し

  Genre / EEAT の事実は内容の根拠として使い、すべてひらがなで書き直すこと。

  --- Task ---
  <%= task %>
article: |
  LANGUAGE: ひらがなのみ。かんじは一文字も使わない。

  がいこく人がよめる、ひらがなの解説きじを1本つくってください。
  タイトルのしつもんに、具体でこたえてください。くうろんは不合格です。
  文は、おとにだしてよめること。1文は「だれが／なにが」と「どうする／どうだ」がつながること。
  よめないことばが1つでもある文は、不合格です。空白わかちがきも不合格です。
  漢字を1字ずつよもうとして、知らない音をつくらない。その語は使わず、やさしいことばに言いかえる。

  タイトル: <%= title %>
  記事タイプ: <%= article_type %>
  参考事実（漢字があっても、出力へそのままコピーしない。ひらがなに直す）:
  <%= source_facts %>

  追加指示:
  <%= extra_prompt %>

  出力はJSONのみ。
  {
    "code": "english-slug",
    "description": "ひらがなの概要。80字前後。",
    "keyword": "ひらがなのキーワードを空白区切り",
    "body": "マークダウン本文"
  }

  bodyの型:
  - 本文のいちばん上に、タイトルを # でくり返さない。導入の文から始める
  - 最初に導入を4〜6文。タイトルの答えを先に書く
  - 本文のH2を3〜4個。それぞれ独立した行の ## 見出し
  - 各H2の本文は4〜7文
  - さいごに独立した行で ## まとめ と3〜5文
  - まとめは、よみ手がやることだけを短く書く。このページでかかないことの弁明は禁止
  - 本文に ## もくじ は書かない。もくじ用のリストも書かない。画面が目次を出す

  記事タイプが pillar のとき:
  - テーマの地図を書く。よみ手が先に知ることだけ
  - くくり（たとえば、制限なし／しかくのしごとだけ／アルバイトのきょかがいる）を具体に出す
  - こきじでかく話を、まとめや本文で「ここではかかない」と言わない
  - 「まずみる」「つぎにかんがえる」だけでおわらない

  記事タイプが child のとき:
  - タイトルのしつもんに、そのままこたえる
  - おやきじのくりかえしだけにしない
  - じょうけん、みかた、やってはいけないことを具体に書く

  絶対ルール:
  - 漢字ゼロ。1文字でも不合格
  - ひらがな、カタカナ、数字、。、、、記号、改行、マークダウンだけ
  - 「。」と「、」を使う。空白で単語を区切らない。ひらがなのあいだの空白は1箇所でも不合格
  - 全体1200〜1800字
  - 同じせつめいをくり返さない
  - セールス文や「このきじでは」ではじめない
  - ## 見出しと同じ行に本文を続けない
  - ## のまえとあとは空行にする
  - 「## もくじ」「## 目次」は禁止
  - えいごのキーやないぶめいを本文に書かない（driver_recruitment、cargo、life_guide、sub_genre、ジャンル: など）
  - 参考事実のラベルをそのまま本文に出さない
  - タイトルとむかんけいのぶんやのせつめいをしない
  - タイトルにないしょくしゅをれいに出さない。どらいばー、うんそう、うんゆ、かーご、amazon は、タイトルにあるときだけ書く
  - えいごのたんごを本文に書かない。ホームページはカタカナで「ホームページ」
  - よめない当て字を作らない（さいかい、せいけい、にゅうりょく、しめい、かくご、ふうしき、すじみち、のどちから、ひがいこじん、いかい、たおい、ざっちょう、よこくべつ、みぎうえ、うんび、ちゅうみつ、はいにる、にゅうるか、つうちょう、まいごする、てづつ、うるすぎる、だんだんする、せいけつ、きじょう、りゅうい、どうきます、あわさせ）
  - 知らないことばは、やさしいことばに言いかえる。漢字のよみがわからないとき、無理によみを当てない
  - 言いかえに使うことばは、きまり、かいてあること、やくわり、ばしょ、なまえ、ホームページ、だけにする
  - 「さいしんのきじ」「さいしんのいかい」など、意味のずれた言いかえは禁止。さいしんはにゅうかんのホームページでかくにんする、と書く
  - 「ここではしめしません」「ここではかきません」「こべつのさいかい」など、よめない文・弁明の文は禁止
  - まとめに、よみての行動以外を書かない

  よくあるまちがい（左側は不合格、右側だけ使う）:
  - 相談 → そうだん
  - 外国人 → がいこくじん
  - 話 → はなし
  - 見る → みる
  - 点 → てん
  - 確認 → かくにん
  - 書類 → しょるい
  - 内容 → ないよう
  - 窓口 → まどぐち
  - 記載 → かいてあること
  - 制度名 → しかくのなまえ
  - 解釈 → よみかた
  - ホームページ → ホームページ（ひらがなのほーむぺえじは不合格）

  よい本文の例:
  えいじゅうしゃでも、どのしごとでもはたらけるとはかぎりません。まずじぶんのざいりゅうかーどをみます。わからないときは、にゅうかんのホームページでかくにんします。

  わるい本文の例:
  ろうどうきじゅんかんとくしょは、相談できる窓口です。みばらいのトラブルでも、手がかりになります。
  わるい本文の例2:
  driver_recruitment のばあいでも、まずかくにんします。つぎにかんがえます。
  わるい本文の例3:
  ていじゅうしゃとしてにほんでくろうするみなさんへ。cargo のどらいばーは、ぶんやにあうかどうかがかぎです。
  わるい本文の例4:
  えいじゅうしゃは、どのしごとでもはたらけるとは かぎりません。ひがいこじんが ちょうせんできます。
  わるい本文の例5:
  はいぐうしゃなどは、ないようのめやすがあることがたおいです。みぎうえのじょうけんにあわせます。
  わるいまとめの例:
  こべつのさいかいのルールはここではしめしません。
  よいまとめの例:
  ざいりゅうかーどでじぶんのしゅるいをみます。せいげんなし、しかくのしごとだけ、アルバイトのきょかがいる、のどれかをみわけます。わからないときはにゅうかんにききます。
kanji_rewrite: |
  LANGUAGE: ひらがなのみ。かんじは一文字も使わない。

  次の文章は、ひらがな記事の下書きです。残っている漢字だけを、よみのひらがなに置き換えてください。
  文の数、見出し、もくじ、- リストは変えない。足さない。大きく短くしない。
  ひらがなとカタカナと数字と記号だけを使う。漢字は1文字も残さない。
  「。」と「、」は残す。空白わかちがきにはしない。
  見出し行（## ）は独立した行のまま残す。数も順番も変えない。
  新しい見出しは足さない。「もくじ」も「まとめ」も新たに足さない。
  本文だけを返す。解説は不要。JSONは不要。

  残っている漢字（すべてひらがなに直す）:
  <%= token_lines %>

  置きかえ例: 相談→そうだん、外国人→がいこくじん、話→はなし、見る→みる、点→てん、確認→かくにん、書類→しょるい、内容→ないよう

  --- もとの文 ---
  <%= text %>
compact: |
  LANGUAGE: ひらがなのみ。かんじは一文字も使わない。

  次の記事を、がいこく人でも読めるみじかいひらがな記事に直してください。

  必須:
  - 漢字ゼロ。1文字でも残さない
  - 「。」と「、」を使う。空白わかちがきは禁止
  - 全体で1200〜<%= max_chars %>字（見出しを含む）
  - 見出しは「## 」の独立した行
  - 本文に「## もくじ」は書かない
  - 本文のH2は3〜4個＋まとめ
  - 各見出しの本文は4〜7文
  - 同じせつめいをくり返さない
  - マークダウン本文のみ。解説は不要

  --- もとの記事 ---
  <%= text %>
