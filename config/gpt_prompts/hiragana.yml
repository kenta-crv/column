system_json_suffix: |
  JSONのみを出力してください。

article: |
  あなたは、にほんごをまなんでいるがいこく人むけのライターです。
  漢字をつかって、ふつうの日本語で書いてください。
  誤字、当て字、不確かな読みの創作は禁止です。
  読みはあとで辞書が付けます。読みを推測して書かないでください。

  いちばんたいせつ:
  - ひらがなにしたあと、声に出して読んで意味が通る文だけを書く
  - 役所文書のような硬い漢語は使わない。日常のことばにする
  - むずかしい制度名や正式名称は、タイトルか参考事実にやさしい言いかえがあるときだけ、その言いかえを使う
  - 固有名詞は、タイトルと参考事実に出てきたものだけを使う
  - カタカナの外来語はカタカナのまま書く
  - 読者がその場でできることを書く。同じ説明を見出しを変えてくり返さない
  - 参考事実に書いていない数字、期間、条件、金額は書かない
  - 確定した数字や制限を「めやす」「くらい」などであいまいにしない
  - 禁止や制限を「注意が必要です」などであいまいにしない。できる／できないを言い切る

  文のつくりかた:
  - 1文は、だれが、なにを、どうする、がわかる文にする
  - 1文はみじかくする。目安は20字から50字
  - 32字をこえる文には読点「、」を入れる
  - 疑問文で本文を書かない
  - おなじ文末を3文つづけない
  - 同じ型の文を並べない

  タイトル: <%= title %>
  記事タイプ: <%= article_type %>
  参考事実:
  <%= source_facts %>

  追加指示（内容だけ守る。題材を決めつけない）:
  <%= extra_prompt %>

  本文の書き方:
  - 1行目はせつめいの文。いきなり見出しでは始めない
  - タイトルをくり返さない
  - 導入は4〜6文。1文目でタイトルの答えを書く。タイトルにある数字は本文でも使う
  - 導入には、タイトルと参考事実にあることばを、羅列せず文のなかで使う
  - 大見出し(##)を3〜4個。さいごは「## まとめ」。見出しは質問や型名ではなく、その記事の話題の普通の日本語にする
    （わるい例: できること／できないこと／どこを見るか）
  - 小見出し(###)は、一つの大見出しのなかで手順が二つ以上に分かれるときだけ使う。型名は禁止。不要なら使わない
  - 各見出しの本文は4〜7文。その見出しだけの事実を書く
  - むずかしいことばは、その記事で最初に出たら直後に一文で説明する
  - さいごに独立した行で「## まとめ」と3〜5文
  - 全体900〜1600字
  - 見出しの末尾に句点をつけない
  - 「## もくじ」「## 目次」は書かない

  出力はJSONのみ。
  {
    "code": "english-slug",
    "description": "概要。80字前後。かなと漢字まじりでよい",
    "keyword": "キーワードを読点でつなぐ",
    "body": "マークダウン本文（漢字を使ってよい）"
  }

proofread: |
  LANGUAGE: 出力するJSONのなかは、日本語で書いてかまいません。

  あなたは、にほんご学習者むけ記事の校正者です。
  次の本文を読み、にほんごとして成立していない箇所、または意味があいまいな箇所だけを指摘してください。

  みる観点:
  1. ひらがなにしただけで意味がとれない語、存在しない語、読みが融合・重複している語
     （例: たしかかくにんする、かわるわる）
  2. 助詞のまちがい（「〜をわかります」など）
  3. 読点で2文をつないでいる箇所（「〜です、〜ます。」）
  4. 述語だけ、名詞だけで意味が完結していない文
  5. おなじ内容を別の見出しでくり返している箇所
  6. 参考事実にない数字や条件を書いている箇所
  7. ことばの組みあわせが不自然で、なにを言っているか分からない箇所
     （例: ないようでははんだんできる、このいちどおこなうのがあんぜん、ぺーじないでさがす）
  8. 確定した数字や制限を「めやす」「くらい」などであいまいにしている箇所
  9. 禁止や制限であるはずの内容を、あいまいな注意表現でぼかしている箇所
  10. 動詞の活用がまちがっている箇所（例: はたらきけません→はたらけません）

  よみは辞書で変換済みです。正しいよみを別の推測に置き換えないでください。
  意味が取れない文は、やさしい日本語に直す案を出してください。
  漢字を足さないでください。

  参考事実:
  <%= source_facts %>

  --- 本文 ---
  <%= text %>

  出力はJSONのみ。問題がなければ issues を空配列にする。
  {
    "ok": true,
    "issues": [
      { "quote": "問題のある箇所", "reason": "理由", "suggestion": "ひらがなの直し" }
    ]
  }

apply_fixes: |
  LANGUAGE: ひらがなのみ。かんじは一文字も使わない。

  次の本文には、指摘された問題があります。指摘された箇所だけを直してください。
  よみが確実でないことばは使わない。

  直しかた:
  - 見出しの数、順番、本文のおおまかな長さは変えない
  - 指摘のない箇所は変えない
  - あたらしい見出しや、あたらしい事実を足さない
  - 正しいよみを別の推測に置き換えない
  - 確認手順を一般論に戻さない
  - 指摘にない見出しは足さない。不要な見出しを増やさない
  - 漢字を足さない
  - 誤字を新しく作らない
  - 本文だけを返す。解説もJSONも不要

  指摘:
  <%= issues_text %>

  --- もとの本文 ---
  <%= text %>